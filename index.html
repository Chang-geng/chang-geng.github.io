<script>
  function fetchPhoneStatus() {
    const SUPABASE_URL = "https://gdwrrnskausesdnwjode.supabase.co";
    const SUPABASE_KEY = "sb_publishable_D06_XLo7cLPXDjbHqFp6sw_26XjgJhh"; 

    fetch(`${SUPABASE_URL}/rest/v1/phone_status?id=eq.1`, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    })
    .then(response => response.json())
    .then(data => {
      if (data && data.length > 0) {
        const status = data[0];

        document.getElementById('status-battery').innerText = status.battery || '--';

        let rawApp = status.current_app;
        let finalApp = '锁屏/桌面';
        let isOnline = true;

        if (!rawApp || rawApp === '?' || rawApp.trim() === '' || rawApp.includes('桌面')) {
          finalApp = '锁屏/桌面';
        } else {
          finalApp = rawApp;
        }

        if (status.updated_at) {
          const lastUpdateUTC = new Date(status.updated_at).getTime();
          const lastUpdateBeijing = lastUpdateUTC + (8 * 60 * 60 * 1000); 
          const now = new Date().getTime();
          const diffMinutes = (now - lastUpdateBeijing) / 1000 / 60;

          if (diffMinutes > 15) {
            finalApp = '似了喵';
            isOnline = false;
          }
        }

        document.getElementById('status-app').innerText = finalApp;
        document.getElementById('status-dot').className = isOnline ? 'status-dot online' : 'status-dot offline';
      }
    })
    .catch(error => console.error(error));
  }
  window.addEventListener('DOMContentLoaded', fetchPhoneStatus);

  document.getElementById('flip-btn').addEventListener('click', function() {
  const body = document.body;
  let currentStage = parseInt(body.dataset.flipStage || '0');
  currentStage = (currentStage + 1) % 4;
  body.dataset.flipStage = currentStage;
  switch(currentStage) {
    case 0:
      body.style.transform = 'none';
      this.innerText = '🌀 颠倒世界';
      break;
    case 1:
      body.style.transform = 'scaleX(-1)';
      this.innerText = '↔️ 左右镜像';
      break;
    case 2:
      body.style.transform = 'scaleY(-1)';
      this.innerText = '↕️ 上下颠倒';
      break;
    case 3:
      body.style.transform = 'scaleX(-1) scaleY(-1)';
      this.innerText = '🙃 全盘崩坏';
      break;
  }
});
</script>
